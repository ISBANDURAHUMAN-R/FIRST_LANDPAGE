name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Web Asset & Markup Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify Web Entrypoint & Stylesheet
        run: |
          test -f index.html || exit 1
          test -f stylemoon.css || exit 1
          echo "Moon Landing Page markup and assets verified successfully."
